spring:
  data:
    mongodb:
      uri: ${MONGODB_URL}
      database: journalDB
      auto-index-creation: true

  redis:
    host: ${REDIS_HOST}
    username: default
    password: ${REDIS_PASSWORD}
    port: 16891
    ssl:
      enabled: true
      connect-timeout: 5s
      timeout: 3s


  mail:
    host: smtp.gmail.com
    port: 587
    username: ${SMTP_MAIL}
    password: ${SPTM_PASSWORD}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true

server:
  port: 8080

#  servlet:
#    context-path: /journal

weather:
  api:
    key: ${WEATHER_API_KEY}

springdoc:
  api-docs:
    enabled : true # disable at prod
    path: /journal-docs

  swagger-ui:
    enabled : true # disable at prod
    path: /docs
    default-models-expand-depth: -1

jwt:
  secret: ${JWT_SECRET}          # Base64, from: openssl rand -base64 64
  expiration-ms: 3600000